<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>もこもこ英単語クイズ</title>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <defs>
        <clipPath id="mokomoko-clip" clipPathUnits="objectBoundingBox">
          <path
            d="M0.18 0.46C0.18 0.34 0.28 0.28 0.36 0.34C0.38 0.16 0.52 0.1 0.6 0.26C0.66 0.12 0.82 0.16 0.84 0.34C0.94 0.3 1.02 0.42 0.94 0.54C1 0.64 0.96 0.78 0.84 0.8C0.82 0.94 0.18 0.96 0.16 0.8C0.04 0.78 0 0.62 0.08 0.52C0.04 0.42 0.1 0.34 0.18 0.46Z"
          />
        </clipPath>
        <filter id="mokomoko-edge-thin" x="-12%" y="-20%" width="124%" height="150%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="0.6" result="spread" />
          <feFlood flood-color="#0e94cc" result="flood" />
          <feComposite in="flood" in2="spread" operator="in" result="outline" />
          <feMerge>
            <feMergeNode in="outline" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="mokomoko-edge" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="spread" />
          <feFlood flood-color="#0e94cc" result="flood" />
          <feComposite in="flood" in2="spread" operator="in" result="outline" />
          <feMerge>
            <feMergeNode in="outline" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="mokomoko-edge-correct" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="spread" />
          <feFlood flood-color="#e23b48" result="flood" />
          <feComposite in="flood" in2="spread" operator="in" result="outline" />
          <feMerge>
            <feMergeNode in="outline" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="mokomoko-edge-wrong" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="spread" />
          <feFlood flood-color="#122848" result="flood" />
          <feComposite in="flood" in2="spread" operator="in" result="outline" />
          <feMerge>
            <feMergeNode in="outline" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
